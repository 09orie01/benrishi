name: jpo-check

# 手動で実行できます（Actions タブ → jpo-check → Run workflow）。
# 定期実行は止めています。2026-10-23 の試験で、特許庁のサイトから HTTP 403 で
# アクセスを拒否されたためです（GitHub の実行環境から自動で取得できませんでした）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリを入れる
        run: pip install openpyxl

      - name: 特許庁のページを確認する
        run: python scripts/jpo_check.py

      - name: 結果を保存する（Excel と summary.json）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jpo-check-output
          path: out/
          if-no-files-found: ignore
